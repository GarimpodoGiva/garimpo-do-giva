<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha — Garimpo do Giva</title>
  <meta name="robots" content="noindex,nofollow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f6f8;
      color: #161616;
      font-family: Inter, Segoe UI, Arial, sans-serif;
    }

    .box {
      width: min(92%, 460px);
      background: #fff;
      border: 1px solid #e4e6ea;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 35px #0000000b;
    }

    .logo {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #ffd400;
      font-size: 34px;
    }

    .eyebrow {
      margin: 16px 0 5px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      color: #555;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    p {
      color: #6d6d6d;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin: 16px 0 7px;
    }

    .password {
      position: relative;
    }

    input {
      width: 100%;
      border: 1px solid #d7dbe0;
      border-radius: 10px;
      background: #fff;
      padding: 12px 44px 12px 13px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #1d1d1d;
      box-shadow: 0 0 0 3px #ffd40055;
    }

    .eye {
      position: absolute;
      right: 5px;
      top: 5px;
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    button.save {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      background: #ffd400;
      color: #111;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .message {
      min-height: 22px;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 700;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #087443;
    }

    .hidden {
      display: none;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: #333;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="box">

    <div class="logo">🔎</div>

    <p class="eyebrow">GARIMPO DO GIVA</p>

    <h1>Nova senha</h1>

    <p id="intro">
      Defina uma nova senha para acessar a Central do Garimpo.
    </p>

    <form id="resetForm" class="hidden">

      <label for="password">
        Nova senha
      </label>

      <div class="password">
        <input
          id="password"
          type="password"
          minlength="6"
          autocomplete="new-password"
          required
        >

        <button
          class="eye"
          id="showPassword"
          type="button"
          aria-label="Mostrar senha"
        >
          👁
        </button>
      </div>


      <label for="confirm">
        Confirmar nova senha
      </label>

      <div class="password">
        <input
          id="confirm"
          type="password"
          minlength="6"
          autocomplete="new-password"
          required
        >

        <button
          class="eye"
          id="showConfirm"
          type="button"
          aria-label="Mostrar confirmação"
        >
          👁
        </button>
      </div>


      <button
        class="save"
        id="saveBtn"
        type="submit"
      >
        Salvar nova senha
      </button>

    </form>


    <p
      id="message"
      class="message"
    ></p>


    <a
      id="backLink"
      class="back hidden"
      href="admin.html"
    >
      ← Voltar para a Central
    </a>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>


  <script>

    const config = window.GARIMPO_SUPABASE || {};

    const message = document.getElementById("message");

    const form = document.getElementById("resetForm");

    const intro = document.getElementById("intro");

    const backLink = document.getElementById("backLink");


    function showMessage(text, type = "") {

      message.textContent = text;

      message.className = "message " + type;

    }


    function toggle(id) {

      const input = document.getElementById(id);

      input.type =
        input.type === "password"
          ? "text"
          : "password";

    }


    document
      .getElementById("showPassword")
      .addEventListener(
        "click",
        () => toggle("password")
      );


    document
      .getElementById("showConfirm")
      .addEventListener(
        "click",
        () => toggle("confirm")
      );


    async function init() {

      if (
        !config.url ||
        !config.publishableKey
      ) {

        showMessage(
          "Configuração do Supabase não encontrada.",
          "error"
        );

        return;
      }


      const client =
        window.supabase.createClient(
          config.url,
          config.publishableKey,
          {
            auth: {
              autoRefreshToken: true,
              persistSession: true,
              detectSessionInUrl: true
            }
          }
        );


      let session = null;


      const {
        data
      } = await client.auth.getSession();


      session = data.session;


      if (!session) {

        await new Promise(resolve => {

          const timeout =
            setTimeout(resolve, 3000);


          const {
            data: listener
          } =
            client.auth.onAuthStateChange(
              (event, nextSession) => {

                if (
                  event === "PASSWORD_RECOVERY" ||
                  nextSession
                ) {

                  session = nextSession;

                  clearTimeout(timeout);

                  listener.subscription.unsubscribe();

                  resolve();

                }

              }
            );

        });

      }


      if (!session) {

        intro.textContent =
          "O link de recuperação é inválido ou expirou. Solicite um novo reset de senha.";

        showMessage(
          "Não foi possível validar o link de recuperação.",
          "error"
        );

        backLink.classList.remove("hidden");

        return;
      }


      /*
       * Remove o token da barra de endereço
       * depois que o Supabase já validou a sessão.
       */

      try {

        history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

      } catch (_) {}


      form.classList.remove("hidden");


      showMessage(
        "Link validado. Escolha sua nova senha.",
        "success"
      );


      form.addEventListener(
        "submit",
        async event => {

          event.preventDefault();


          const password =
            document.getElementById(
              "password"
            ).value;


          const confirm =
            document.getElementById(
              "confirm"
            ).value;


          const button =
            document.getElementById(
              "saveBtn"
            );


          if (password.length < 6) {

            showMessage(
              "A senha precisa ter pelo menos 6 caracteres.",
              "error"
            );

            return;
          }


          if (password !== confirm) {

            showMessage(
              "As senhas não são iguais.",
              "error"
            );

            return;
          }


          button.disabled = true;

          button.textContent =
            "Salvando...";


          const {
            error
          } =
            await client.auth.updateUser({
              password
            });


          button.disabled = false;

          button.textContent =
            "Salvar nova senha";


          if (error) {

            showMessage(
              "Não foi possível alterar a senha: " +
              error.message,
              "error"
            );

            return;
          }


          form.classList.add("hidden");


          intro.textContent =
            "Sua senha foi alterada com sucesso.";


          showMessage(
            "Senha atualizada. Agora você pode entrar na Central.",
            "success"
          );


          backLink.classList.remove("hidden");


          setTimeout(() => {

            window.location.href =
              "admin.html";

          }, 1200);

        }
      );

    }


    init().catch(error => {

      console.error(error);

      showMessage(
        "Ocorreu um erro ao validar a recuperação.",
        "error"
      );

    });

  </script>

</body>
</html>
